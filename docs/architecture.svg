<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14">
  <title>Yardline architecture: the same API runs in a SharedWorker for the demo and on Node for production</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4d514b"/>
    </marker>
    <style>
      .panel { fill: #faf9f6; stroke: #e5e2da; }
      .box { fill: #ffffff; stroke: #d3cec3; }
      .core { fill: #173b2d; }
      .h { font-weight: 700; fill: #1b1d1a; font-size: 16px; }
      .t { fill: #1b1d1a; font-weight: 600; }
      .s { fill: #6b6e67; font-size: 12.5px; }
      .w { fill: #ffffff; font-weight: 600; }
      .ws { fill: #b9cdc2; font-size: 12.5px; }
      .line { stroke: #4d514b; stroke-width: 1.5; fill: none; }
      .dash { stroke-dasharray: 5 4; }
      .tag { fill: #e6f1eb; }
      .tagt { fill: #1f6b4c; font-size: 12px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- Demo panel -->
  <rect class="panel" x="20" y="20" width="560" height="420" rx="14"/>
  <text class="h" x="44" y="54">Live demo: static files, no backend</text>
  <text class="s" x="44" y="76">GitHub Pages serves HTML, JS and the Postgres WebAssembly build.</text>

  <rect class="box" x="44" y="100" width="230" height="74" rx="10"/>
  <text class="t" x="62" y="130">Tab 1 · sales rep</text>
  <text class="s" x="62" y="152">React UI: quotes, editor, orders</text>
  <rect class="box" x="326" y="100" width="230" height="74" rx="10"/>
  <text class="t" x="344" y="130">Tab 2 · customer link</text>
  <text class="s" x="344" y="152">Accept or decline</text>

  <path class="line" d="M159 174 V214" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="line" d="M441 174 V214" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s" x="170" y="200">MessagePort</text>
  <text class="s" x="452" y="200">MessagePort</text>

  <rect class="box" x="44" y="218" width="512" height="198" rx="10" stroke="#1f6b4c" stroke-width="1.5"/>
  <text class="t" x="62" y="246">SharedWorker: one "server" shared by every tab</text>
  <rect class="tag" x="62" y="262" width="236" height="62" rx="8"/>
  <text class="tagt" x="76" y="286">Hono API, the same code</text>
  <text class="tagt" x="76" y="306">as production (app.fetch)</text>
  <rect class="tag" x="306" y="262" width="232" height="62" rx="8"/>
  <text class="tagt" x="320" y="286">PGlite: Postgres 16 in</text>
  <text class="tagt" x="320" y="306">WebAssembly, in IndexedDB</text>
  <text class="s" x="62" y="352">Events are published after each commit and pushed to every port,</text>
  <text class="s" x="62" y="372">so the rep's tab updates when the customer accepts in the other tab.</text>
  <text class="s" x="62" y="398">Header auth (persona switcher) exists only in this build.</text>

  <!-- Server panel -->
  <rect class="panel" x="620" y="20" width="560" height="420" rx="14"/>
  <text class="h" x="644" y="54">Server mode: Node + Postgres</text>
  <text class="s" x="644" y="76">The same UI build switches to fetch and EventSource.</text>

  <rect class="box" x="644" y="100" width="512" height="56" rx="10"/>
  <text class="t" x="662" y="133">Browsers</text>
  <text class="s" x="742" y="133">session cookie (HttpOnly, SameSite=Lax) · SSE per quote</text>

  <path class="line" d="M900 156 V190" marker-end="url(#a)" marker-start="url(#a)"/>

  <rect class="box" x="644" y="194" width="512" height="104" rx="10" stroke="#1f6b4c" stroke-width="1.5"/>
  <text class="t" x="662" y="222">Node server (@hono/node-server)</text>
  <text class="s" x="662" y="246">same Hono API · scrypt passwords, hashed session tokens</text>
  <text class="s" x="662" y="268">/api/quotes/:id/stream (Server-Sent Events)</text>
  <text class="s" x="662" y="288">serves the built UI with an SPA fallback</text>

  <path class="line" d="M900 298 V330" marker-end="url(#a)" marker-start="url(#a)"/>

  <rect class="box" x="644" y="334" width="512" height="82" rx="10"/>
  <text class="t" x="662" y="362">PostgreSQL</text>
  <text class="s" x="662" y="384">row locks (FOR UPDATE) · CHECK reserved &lt;= on_hand · pg_trgm</text>
  <text class="s" x="662" y="404">LISTEN/NOTIFY fans events out to every server instance</text>

  <!-- Core -->
  <rect class="core" x="20" y="470" width="1160" height="110" rx="14"/>
  <text class="w" x="44" y="504">@yardline/core: pure TypeScript, no dependencies, used by both</text>
  <text class="ws" x="44" y="530">List parser ("2x6-16' x 24", "(12) 2x10x12 DF", "hurricane ties x50") · catalog matcher with confidence</text>
  <text class="ws" x="44" y="552">Lumber priced per MBF on nominal board feet · tier + volume + rep discounts · margin floor · HST · integer cents</text>
  <path class="line dash" d="M300 440 V470" stroke="#8aa596"/>
  <path class="line dash" d="M900 440 V470" stroke="#8aa596"/>
</svg>
